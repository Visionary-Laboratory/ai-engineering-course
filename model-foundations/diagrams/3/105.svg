<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="候选序列在不同时间结束"><title>候选序列在不同时间结束</title><desc>遇到结束符后移入已完成集合 结束条件、长度处理和序列评分需要使用一致的规则。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="78" y="159" width="293" height="80" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="224.5" y="187" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="224.5" dy="0">未完成候选</tspan></text><text x="224.5" y="216" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="224.5" dy="0">继续生成</tspan></text><rect x="78" y="331" width="293" height="80" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="224.5" y="359" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="224.5" dy="0">已完成候选</tspan></text><text x="224.5" y="388" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="224.5" dy="0">包含 &lt;END&gt;</tspan></text><path d="M379 199 L570 199" stroke="#176653" stroke-width="2" fill="none"/><path d="M562.0170456949865 203.15601257987333 L570 199 L562.0170456949865 194.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><text x="474.5" y="190" fill="#176653" font-size="14" font-weight="400" text-anchor="middle"><tspan x="474.5" dy="0">扩展</tspan></text><rect x="589" y="153" width="293" height="92" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="735.5" y="181" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="735.5" dy="0">继续保留 Top-k</tspan></text><text x="735.5" y="210" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="735.5" dy="0">按同一评分规则比较</tspan></text><path d="M724 249 L724 326" stroke="#176653" stroke-width="2" fill="none"/><path d="M719.8439874201266 318.01704569498645 L724 326 L728.1560125798734 318.01704569498645" fill="none" stroke="#176653" stroke-width="2"/><text x="724" y="278.5" fill="#176653" font-size="14" font-weight="400" text-anchor="middle"><tspan x="724" dy="0">产生结束符</tspan></text><rect x="589" y="333" width="293" height="79" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="735.5" y="379.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="735.5" dy="0">停止或进入完成集合</tspan></text><path d="M584 373 L378 373" stroke="#b47936" stroke-width="2" fill="none"/><path d="M385.98295430501355 368.84398742012667 L378 373 L385.98295430501355 377.15601257987333" fill="none" stroke="#b47936" stroke-width="2"/><text x="481" y="364" fill="#b47936" font-size="14" font-weight="400" text-anchor="middle"><tspan x="481" dy="0">收集完成候选</tspan></text></g></svg>