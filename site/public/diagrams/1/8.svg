<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="人工智能的发展线索"><title>人工智能的发展线索</title><desc>从可计算的智能问题，到由数据驱动的模型 不同阶段的方法相互联系，并非简单替代。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><path d="M90 260 L870 260" stroke="#a8c2b4" stroke-width="3" fill="none"/><circle cx="90" cy="260" r="11" fill="#176653" stroke="#ffffff" stroke-width="1.7"/><path d="M90 242 L90 201" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="90" y="161" fill="#263f35" font-size="18" font-weight="550" text-anchor="middle"><tspan x="90" dy="0">图灵的设问</tspan></text><circle cx="285" cy="260" r="11" fill="#176653" stroke="#ffffff" stroke-width="1.7"/><path d="M285 278 L285 319" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="285" y="349" fill="#263f35" font-size="18" font-weight="550" text-anchor="middle"><tspan x="285" dy="0">符号与搜索</tspan></text><circle cx="480" cy="260" r="11" fill="#b47936" stroke="#ffffff" stroke-width="1.7"/><path d="M480 242 L480 201" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="480" y="161" fill="#263f35" font-size="18" font-weight="550" text-anchor="middle"><tspan x="480" dy="0">统计机器学习</tspan></text><circle cx="675" cy="260" r="11" fill="#176653" stroke="#ffffff" stroke-width="1.7"/><path d="M675 278 L675 319" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="675" y="349" fill="#263f35" font-size="18" font-weight="550" text-anchor="middle"><tspan x="675" dy="0">深度神经网络</tspan></text><circle cx="870" cy="260" r="11" fill="#176653" stroke="#ffffff" stroke-width="1.7"/><path d="M870 242 L870 201" stroke="#a8c2b4" stroke-width="2" fill="none"/><text x="870" y="161" fill="#263f35" font-size="18" font-weight="550" text-anchor="middle"><tspan x="870" dy="0">生成式模型</tspan></text><text x="480" y="425" fill="#667f72" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">研究问题　×　可用数据　×　计算资源　×　训练方法</tspan></text></g></svg>