<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="机器翻译的两个方向"><title>机器翻译的两个方向</title><desc>从统计建模走向端到端的神经建模 源序列与目标序列不要求长度或词序一致。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="80" y="210" width="246.66666666666666" height="101" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="203.33333333333331" y="238" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="203.33333333333331" dy="0">源语言</tspan></text><text x="203.33333333333331" y="267" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="203.33333333333331" dy="0">Machine Translation</tspan></text><path d="M328.66666666666663 260.5 L353.66666666666663 260.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M345.6837123616531 264.65601257987333 L353.66666666666663 260.5 L345.6837123616531 256.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="356.66666666666663" y="210" width="246.66666666666666" height="101" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="479.99999999999994" y="238" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="479.99999999999994" dy="0">对齐与表示</tspan></text><text x="479.99999999999994" y="267" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="479.99999999999994" dy="0">表示与解码</tspan></text><path d="M605.3333333333333 260.5 L630.3333333333333 260.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M622.3503790283197 264.65601257987333 L630.3333333333333 260.5 L622.3503790283197 256.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="633.3333333333333" y="210" width="246.66666666666666" height="101" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="756.6666666666666" y="238" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="756.6666666666666" dy="0">目标序列</tspan></text><text x="756.6666666666666" y="267" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="756.6666666666666" dy="0">Maschinelle Übersetzung</tspan></text><text x="480" y="409" fill="#667f72" font-size="20" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">语言之间的词序、长度与对应关系都可能不同</tspan></text></g></svg>