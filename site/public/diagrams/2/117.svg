<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="DenseNet：把已有特征传给后续层"><title>DenseNet：把已有特征传给后续层</title><desc>跨层连接使用特征拼接 拼接与残差相加是不同的操作。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="50" y="293" width="192.5" height="77" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="146.25" y="338.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="146.25" dy="0">x<tspan baseline-shift="sub" font-size="72%">0</tspan></tspan></text><path d="M244.5 331.5 L269.5 331.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M261.51704569498645 335.65601257987333 L269.5 331.5 L261.51704569498645 327.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="272.5" y="293" width="192.5" height="77" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="368.75" y="338.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="368.75" dy="0">层 1</tspan></text><path d="M467 331.5 L492 331.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M484.01704569498645 335.65601257987333 L492 331.5 L484.01704569498645 327.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="495" y="293" width="192.5" height="77" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="591.25" y="338.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="591.25" dy="0">层 2</tspan></text><path d="M689.5 331.5 L714.5 331.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M706.5170456949865 335.65601257987333 L714.5 331.5 L706.5170456949865 327.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="717.5" y="293" width="192.5" height="77" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="813.75" y="338.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="813.75" dy="0">层 3</tspan></text><path d="M146 291 V211 H372 V290" fill="none" stroke="#a8c2b4" stroke-width="1.8"/><path d="M146 291 V167 H598 V290" fill="none" stroke="#b47936" stroke-width="1.8"/><path d="M146 291 V123 H824 V290" fill="none" stroke="#b47936" stroke-width="1.8"/><path d="M372 291 V211 H598 V290" fill="none" stroke="#a8c2b4" stroke-width="1.8"/><path d="M372 291 V167 H824 V290" fill="none" stroke="#b47936" stroke-width="1.8"/><path d="M598 291 V211 H824 V290" fill="none" stroke="#a8c2b4" stroke-width="1.8"/><text x="480" y="135" fill="#176653" font-size="21" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">每一层接收此前所有层的特征拼接</tspan></text><text x="480" y="445" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">xℓ = Hℓ([x<tspan baseline-shift="sub" font-size="72%">0</tspan>,x<tspan baseline-shift="sub" font-size="72%">1</tspan>,…,xℓ<tspan baseline-shift="sub" font-size="72%">-1</tspan>])</tspan></text></g></svg>