<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="最大池化的梯度路径"><title>最大池化的梯度路径</title><desc>把上游梯度送回前向最大值的位置 平均池化会按窗口规则分配梯度；重叠窗口的贡献要累加。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="100" y="177" width="69" height="69" rx="3" fill="#ffffff" stroke="#a8c2b4"/><text x="134.5" y="218" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="134.5" dy="0">1</tspan></text><rect x="172" y="177" width="69" height="69" rx="3" fill="#ffffff" stroke="#a8c2b4"/><text x="206.5" y="218" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="206.5" dy="0">3</tspan></text><rect x="100" y="249" width="69" height="69" rx="3" fill="#176653" stroke="#a8c2b4"/><text x="134.5" y="290" fill="white" font-size="17" font-weight="400" text-anchor="middle"><tspan x="134.5" dy="0">4</tspan></text><rect x="172" y="249" width="69" height="69" rx="3" fill="#ffffff" stroke="#a8c2b4"/><text x="206.5" y="290" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="206.5" dy="0">2</tspan></text><path d="M268 248 L396 248" stroke="#176653" stroke-width="2" fill="none"/><path d="M388.01704569498645 252.15601257987333 L396 248 L388.01704569498645 243.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><text x="332" y="239" fill="#176653" font-size="14" font-weight="400" text-anchor="middle"><tspan x="332" dy="0">取最大值</tspan></text><rect x="420" y="207" width="126" height="77" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="483" y="252.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="483" dy="0">4</tspan></text><path d="M562 248 L688 248" stroke="#b47936" stroke-width="2" fill="none"/><path d="M680.0170456949865 252.15601257987333 L688 248 L680.0170456949865 243.84398742012667" fill="none" stroke="#b47936" stroke-width="2"/><text x="625" y="239" fill="#b47936" font-size="14" font-weight="400" text-anchor="middle"><tspan x="625" dy="0">上游梯度 g</tspan></text><rect x="725" y="177" width="59" height="59" rx="3" fill="#ffffff" stroke="#a8c2b4"/><text x="754.5" y="213" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="754.5" dy="0">0</tspan></text><rect x="787" y="177" width="59" height="59" rx="3" fill="#ffffff" stroke="#a8c2b4"/><text x="816.5" y="213" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="816.5" dy="0">0</tspan></text><rect x="725" y="239" width="59" height="59" rx="3" fill="#176653" stroke="#a8c2b4"/><text x="754.5" y="275" fill="white" font-size="17" font-weight="400" text-anchor="middle"><tspan x="754.5" dy="0">g</tspan></text><rect x="787" y="239" width="59" height="59" rx="3" fill="#ffffff" stroke="#a8c2b4"/><text x="816.5" y="275" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="816.5" dy="0">0</tspan></text><text x="480" y="406" fill="#176653" font-size="21" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">梯度只回到本次前向传播的最大值位置</tspan></text></g></svg>