<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="跨通道预测：Split-Brain Autoencoders"><title>跨通道预测：Split-Brain Autoencoders</title><desc>将输入分为两个通道子集，互相预测缺失部分 同一灰度输入可能对应多种合理颜色。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="55" y="228" width="161" height="87" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="135.5" y="278.5" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="135.5" dy="0">通道拆分 X</tspan></text><path d="M221 271 L294 182" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M292.1506988819806 190.80795580000785 L294 182 L285.72398572321543 185.5366068046162" fill="none" stroke="#a8c2b4" stroke-width="2"/><rect x="302" y="145" width="151" height="76" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="377.5" y="190" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="377.5" dy="0">X<tspan baseline-shift="sub" font-size="72%">1</tspan></tspan></text><path d="M458 183 L518 183" stroke="#176653" stroke-width="2" fill="none"/><path d="M510.01704569498645 187.15601257987333 L518 183 L510.01704569498645 178.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="526" y="145" width="151" height="76" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="601.5" y="190" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="601.5" dy="0">编码器</tspan></text><path d="M682 183 L742 183" stroke="#176653" stroke-width="2" fill="none"/><path d="M734.0170456949865 187.15601257987333 L742 183 L734.0170456949865 178.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="750" y="145" width="154" height="76" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="827" y="190" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="827" dy="0">预测 X<tspan baseline-shift="sub" font-size="72%">2</tspan></tspan></text><path d="M221 271 L294 376" stroke="#a8c2b4" stroke-width="2" fill="none"/><path d="M286.03069284192134 371.8178781198779 L294 376 L292.8554020514947 367.07308028846023" fill="none" stroke="#a8c2b4" stroke-width="2"/><rect x="302" y="339" width="151" height="76" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="377.5" y="384" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="377.5" dy="0">X<tspan baseline-shift="sub" font-size="72%">2</tspan></tspan></text><path d="M458 377 L518 377" stroke="#176653" stroke-width="2" fill="none"/><path d="M510.01704569498645 381.15601257987333 L518 377 L510.01704569498645 372.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="526" y="339" width="151" height="76" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="601.5" y="384" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="601.5" dy="0">编码器</tspan></text><path d="M682 377 L742 377" stroke="#176653" stroke-width="2" fill="none"/><path d="M734.0170456949865 381.15601257987333 L742 377 L734.0170456949865 372.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="750" y="339" width="154" height="76" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="827" y="384" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="827" dy="0">预测 X<tspan baseline-shift="sub" font-size="72%">1</tspan></tspan></text><text x="480" y="463" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">跨通道预测需要补全信息，不能直接复制同一输入通道</tspan></text></g></svg>