<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="重复提问中的两种回答"><title>重复提问中的两种回答</title><desc>比较机械重复与利用对话上下文的回答 原例询问是否会下国际象棋，比较的是回答方式与上下文理解。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="480" y="122" fill="#263f35" font-size="23" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">反复询问：你会下国际象棋吗？</tspan></text><rect x="40" y="169" width="410" height="220" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="245" y="211" fill="#176653" font-size="22" font-weight="400" text-anchor="middle"><tspan x="245" dy="0">回答 A：机械重复</tspan></text><text x="245" y="274" fill="#263f35" font-size="19" font-weight="400" text-anchor="middle"><tspan x="245" dy="0">是的。</tspan><tspan x="245" dy="27.55">是的。</tspan><tspan x="245" dy="27.55">是的。</tspan></text><rect x="510" y="169" width="410" height="220" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="715" y="211" fill="#176653" font-size="22" font-weight="400" text-anchor="middle"><tspan x="715" dy="0">回答 B：结合上下文</tspan></text><text x="715" y="274" fill="#263f35" font-size="19" font-weight="400" text-anchor="middle"><tspan x="715" dy="0">是的。</tspan><tspan x="715" dy="27.55">是的，我不是已经说过了吗？</tspan><tspan x="715" dy="27.55">你烦不烦，干嘛老是提同样的问题。</tspan></text><text x="480" y="452" fill="#176653" font-size="20" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">比较回答方式与上下文理解能力</tspan></text></g></svg>