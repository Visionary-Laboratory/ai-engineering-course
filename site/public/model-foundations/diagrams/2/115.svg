<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="比较深度、结构与训练成本"><title>比较深度、结构与训练成本</title><desc>性能图需要结合参数、计算和训练设置解读 比较连接方式与特征传递，再结合计算成本选择网络结构。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="48" y="148" width="288.3333333333333" height="47" fill="#e9f3ee"/><text x="60" y="177.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="60" dy="0">设计</tspan></text><rect x="336.3333333333333" y="148" width="288.3333333333333" height="47" fill="#e9f3ee"/><text x="348.3333333333333" y="177.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="348.3333333333333" dy="0">信息如何组合</tspan></text><rect x="624.6666666666666" y="148" width="288.3333333333333" height="47" fill="#e9f3ee"/><text x="636.6666666666666" y="177.5" fill="#176653" font-size="16" font-weight="600" text-anchor="start"><tspan x="636.6666666666666" dy="0">主要关注</tspan></text><rect x="48" y="195" width="288.3333333333333" height="47" fill="#f7faf8"/><text x="60" y="224.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="60" dy="0">VGG</tspan></text><rect x="336.3333333333333" y="195" width="288.3333333333333" height="47" fill="#f7faf8"/><text x="348.3333333333333" y="224.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="348.3333333333333" dy="0">顺序堆叠小卷积</tspan></text><rect x="624.6666666666666" y="195" width="288.3333333333333" height="47" fill="#f7faf8"/><text x="636.6666666666666" y="224.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="636.6666666666666" dy="0">规整的深层结构</tspan></text><rect x="48" y="242" width="288.3333333333333" height="47" fill="#ffffff"/><text x="60" y="271.5" fill="#263f35" font-size="15" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Inception</tspan></text><rect x="336.3333333333333" y="242" width="288.3333333333333" height="47" fill="#ffffff"/><text