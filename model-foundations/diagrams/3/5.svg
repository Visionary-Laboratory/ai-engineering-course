<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="词如何成为模型输入"><title>词如何成为模型输入</title><desc>文本先拆成离散符号，再映射为数值 </desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="55" y="228" width="190" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="150" y="256" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="150" dy="0">一段文本</tspan></text><text x="150" y="285" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="150" dy="0">语言符号</tspan></text><path d="M247 273 L272 273" stroke="#176653" stroke-width="2" fill="none"/><path d="M264.01704569498645 277.15601257987333 L272 273 L264.01704569498645 268.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="275" y="228" width="190" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="370" y="256" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="370" dy="0">词表索引</tspan></text><text x="370" y="285" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="370" dy="0">离散 ID</tspan></text><path d="M467 273 L492 273" stroke="#176653" stroke-width="2" fill="none"/><path d="M484.01704569498645 277.15601257987333 L492 273 L484.01704569498645 268.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="495" y="228" width="190" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="590" y="256" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="590" dy="0">数值表示</tspan></text><text x="590" y="285" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="590" dy="0">可计算向量</tspan></text><path d="M687 273 L712 273" stroke="#176653" stroke-width="2" fill="none"/><path d="M704.0170456949865 277.15601257987333 L712 273 L704.0170456949865 268.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="715" y="228" width="190" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="810" y="256" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="810" dy="0">神经网络</tspan></text><text x="810" y="285" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="810" dy="0">学习映射</tspan></text><text x="480" y="413" fill="#176653" font-size="20" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">模型处理的是表示，而不是词形本身</tspan></text></g></svg>