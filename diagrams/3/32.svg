<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="词向量的训练路径"><title>词向量的训练路径</title><desc>从中心词—上下文样本得到梯度信号 </desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="45" y="189" width="195" height="94" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="142.5" y="217" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="142.5" dy="0">中心词 ID</tspan></text><text x="142.5" y="246" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="142.5" dy="0">构造训练样本</tspan></text><path d="M242 236 L267 236" stroke="#176653" stroke-width="2" fill="none"/><path d="M259.01704569498645 240.15601257987333 L267 236 L259.01704569498645 231.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="270" y="189" width="195" height="94" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="367.5" y="217" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="367.5" dy="0">查表 E</tspan></text><text x="367.5" y="246" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="367.5" dy="0">得到词向量</tspan></text><path d="M467 236 L492 236" stroke="#176653" stroke-width="2" fill="none"/><path d="M484.01704569498645 240.15601257987333 L492 236 L484.01704569498645 231.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="495" y="189" width="195" height="94" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="592.5" y="217" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="592.5" dy="0">上下文分数</tspan></text><text x="592.5" y="246" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="592.5" dy="0">对词表建模</tspan></text><path d="M692 236 L717 236" stroke="#176653" stroke-width="2" fill="none"/><path d="M709.0170456949865 240.15601257987333 L717 236 L709.0170456949865 231.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="720" y="189" width="195" height="94" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="817.5" y="217" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="817.5" dy="0">训练损失</tspan></text><text x="817.5" y="246" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="817.5" dy="0">目标来自语料</tspan></text><path d="M824 361 L327 361" stroke="#b47936" stroke-width="2" fill="none"/><path d="M334.98295430501355 356.84398742012667 L327 361 L334.98295430501355 365.15601257987333" fill="none" stroke="#b47936" stroke-width="2"/><text x="575.5" y="352" fill="#b47936" font-size="14" font-weight="400" text-anchor="middle"><tspan x="575.5" dy="0">通过梯度调整嵌入与输出参数</tspan></text><text x="480" y="442" fill="#667f72" font-size="19" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">词向量在预测任务中被学到，而非人工指定每维语义</tspan></text></g></svg>