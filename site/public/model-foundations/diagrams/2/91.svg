<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="小数据下的迁移学习"><title>小数据下的迁移学习</title><desc>复用预训练表示，再选择冻结或微调 冻结范围取决于数据规模、任务相似性与验证表现。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="42" y="223" width="197.25" height="94" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="140.625" y="251" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="140.625" dy="0">目标数据</tspan></text><text x="140.625" y="280" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="140.625" dy="0">较少标注</tspan></text><path d="M241.25 270 L266.25 270" stroke="#176653" stroke-width="2" fill="none"/><path d="M258.26704569498645 274.15601257987333 L266.25 270 L258.26704569498645 265.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="269.25" y="223" width="197.25" height="94" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="367.875" y="251" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="367.875" dy="0">预训练主干</tspan></text><text x="367.875" y="280" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="367.875" dy="0">复用已有表示</tspan></text><path d="M468.5 270 L493.5 270" stroke="#176653" stroke-width="2" fill="none"/><path d="M485.51704569498645 274.15601257987333 L493.5 270 L485.51704569498645 265.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="496.5" y="223" width="197.25" height="94" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="595.125" y="251" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="595.125" dy="0">新分类头</tspan></text><text x="595.125" y="280" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="595.125" dy="0">适配目标标签</tspan></text><path d="M695.75 270 L720.75 270" stroke="#176653" stroke-width="2" fill="none"/><path d="M712.7670456949865 274.