<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="Xavier 初始化的方差关系"><title>Xavier 初始化的方差关系</title><desc>把输入维度、权重方差和输出方差联系起来 推导依赖独立性、零均值等近似条件；不同激活需要相应调整。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="110" y="160" width="226.66666666666666" height="95" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="223.33333333333331" y="188" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="223.33333333333331" dy="0">输入方差</tspan></text><text x="223.33333333333331" y="217" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="223.33333333333331" dy="0">Var(x)</tspan></text><path d="M338.66666666666663 207.5 L363.66666666666663 207.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M355.6837123616531 211.65601257987333 L363.66666666666663 207.5 L355.6837123616531 203.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="366.66666666666663" y="160" width="226.66666666666666" height="95" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="479.99999999999994" y="188" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="479.99999999999994" dy="0">线性层</tspan></text><text x="479.99999999999994" y="217" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="479.99999999999994" dy="0">fan_in 个乘加</tspan></text><path d="M595.3333333333333 207.5 L620.3333333333333 207.5" stroke="#176653" stroke-width="2" fill="none"/><path d="M612.3503790283197 211.65601257987333 L620.3333333333333 207.5 L612.3503790283197 203.34398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="623.3333333333333" y="160" width="226.66666666666666" height="95" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="736.6666666666666" y="188" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="736.6666666666666" dy="0">输出方差</tspan></text><text x="736.6666666666666" y="217" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="736.6666666666666" dy="0">fan_in · Var(w) · Var(x)</tspan></text><rect x="165" y="329" width="270" height="64" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="300" y="368" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="300" dy="0">Xavier：兼顾输入与输出</tspan></text><rect x="515" y="329" width="270" height="64" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="650" y="368" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="650" dy="0">He：考虑 ReLU 的作用</tspan></text><text x="480" y="459" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">Var(z) ≈ fan_in · Var(w) · Var(x)</tspan></text></g></svg>