<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="多通道标准卷积"><title>多通道标准卷积</title><desc>跨输入通道求和，再由多个核形成输出通道 </desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="94" y="171" width="143" height="155" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><rect x="83" y="181" width="143" height="155" fill="#ecf3f8" stroke="#a8c2b4" stroke-width="1.5"/><rect x="72" y="191" width="143" height="155" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="143.5" y="376" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="143.5" dy="0">Cin 个通道</tspan></text><path d="M256 264 L359 264" stroke="#176653" stroke-width="2" fill="none"/><path d="M351.01704569498645 268.15601257987333 L359 264 L351.01704569498645 259.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="415" y="208" width="74" height="74" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><rect x="404" y="218" width="74" height="74" fill="#ecf3f8" stroke="#a8c2b4" stroke-width="1.5"/><rect x="393" y="228" width="74" height="74" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="430" y="332" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="430" dy="0">核覆盖全部 Cin</tspan></text><path d="M509 264 L612 264" stroke="#176653" stroke-width="2" fill="none"/><path d="M604.0170456949865 268.15601257987333 L612 264 L604.0170456949865 259.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><text x="560.5" y="255" fill="#176653" font-size="14" font-weight="400" text-anchor="middle"><tspan x="560.5" dy="0">乘加求和</tspan></text><rect x="690" y="161" width="143" height="155" fill="#ecf3f8" stroke="#a8c2b4" stroke-width="1.5"/><rect x="679" y="171" width="143" height="155" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><rect x="668" y="181" width="143" height="155" fill="#ecf3f8" stroke="#a8c2b4" stroke-width="1.5"/><rect x="657" y="191" width="143" height="155" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="728.5" y="376" fill="#263f35" font-size="17" font-weight="400" text-anchor="middle"><tspan x="728.5" dy="0">Cout 个特征图</tspan></text><text x="480" y="145" fill="#176653" font-size="21" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">一个输出通道 = 各输入通道局部响应之和</tspan></text><text x="480" y="461" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">参数量（不含偏置）= kh × kw × Cin × Cout</tspan></text></g></svg>