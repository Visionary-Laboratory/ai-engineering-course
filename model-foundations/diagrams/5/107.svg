<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="无标签的教师—学生学习"><title>无标签的教师—学生学习</title><desc>不同视图的预测通过蒸馏目标保持一致 教师参数采用移动平均；中心化与温度处理控制输出分布。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="50" y="133" width="265.3333333333333" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="182.66666666666666" y="161" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="182.66666666666666" dy="0">视图 1</tspan></text><text x="182.66666666666666" y="190" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="182.66666666666666" dy="0">局部 / 全局裁剪</tspan></text><path d="M317.3333333333333 178 L342.3333333333333 178" stroke="#176653" stroke-width="2" fill="none"/><path d="M334.35037902831976 182.15601257987333 L342.3333333333333 178 L334.35037902831976 173.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="345.3333333333333" y="133" width="265.3333333333333" height="90" rx="9" fill="#fbf0dd" stroke="#a8c2b4" stroke-width="1.5"/><text x="478" y="161" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="478" dy="0">学生网络</tspan></text><text x="478" y="190" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="478" dy="0">梯度更新</tspan></text><path d="M612.6666666666666 178 L637.6666666666666 178" stroke="#176653" stroke-width="2" fill="none"/><path d="M629.6837123616531 182.15601257987333 L637.6666666666666 178 L629.6837123616531 173.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="640.6666666666666" y="133" width="265.3333333333333" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="773.3333333333333" y="161" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="773.3333333333333" dy="0">学生分布</tspan></text><text x="773.3333333333333" y="190" fill="#667f72" font-size="14" font-wei