<svg xmlns="http://www.w3.org/2000/svg" width="960" height="417" viewBox="0 72 960 417" role="img" aria-label="指数移动平均"><title>指数移动平均</title><desc>新的统计量由历史状态与当前观测共同决定 β 越大，历史信息的衰减通常越慢。</desc><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="100" y="192" width="233.33333333333334" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="216.66666666666669" y="220" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="216.66666666666669" dy="0">历史 v<tspan baseline-shift="sub" font-size="72%">t-1</tspan></tspan></text><text x="216.66666666666669" y="249" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="216.66666666666669" dy="0">权重 β</tspan></text><path d="M335.33333333333337 237 L360.33333333333337 237" stroke="#176653" stroke-width="2" fill="none"/><path d="M352.3503790283198 241.15601257987333 L360.33333333333337 237 L352.3503790283198 232.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="363.33333333333337" y="192" width="233.33333333333334" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="480.00000000000006" y="220" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="480.00000000000006" dy="0">加权组合</tspan></text><text x="480.00000000000006" y="249" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="480.00000000000006" dy="0">βv<tspan baseline-shift="sub" font-size="72%">t-1</tspan> + (1−β)g<tspan baseline-shift="sub" font-size="72%">t</tspan></tspan></text><path d="M598.6666666666667 237 L623.6666666666667 237" stroke="#176653" stroke-width="2" fill="none"/><path d="M615.6837123616532 241.15601257987333 L623.6666666666667 237 L615.6837123616532 232.84398742012667" fill="none" stroke="#176653" stroke-width="2"/><rect x="626.6666666666667" y="192" width="233.33333333333334" height="90" rx="9" fill="#e9f3ee" stroke="#a8c2b4" stroke-width="1.5"/><text x="743.3333333333334" y="220" fill="#263f35" font-size="19" font-weight="550" text-anchor="middle"><tspan x="743.3333333333334" dy="0">当前 v<tspan baseline-shift="sub" font-size="72%">t</tspan></tspan></text><text x="743.3333333333334" y="249" fill="#667f72" font-size="14" font-weight="400" text-anchor="middle"><tspan x="743.3333333333334" dy="0">用于本次更新</tspan></text><path d="M480 387 L480 287" stroke="#b47936" stroke-width="2" fill="none"/><path d="M484.15601257987333 294.98295430501355 L480 287 L475.84398742012667 294.98295430501355" fill="none" stroke="#b47936" stroke-width="2"/><text x="480" y="328" fill="#b47936" font-size="14" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">当前观测 g<tspan baseline-shift="sub" font-size="72%">t</tspan></tspan></text><text x="480" y="449" fill="#176653" font-size="18" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">v<tspan baseline-shift="sub" font-size="72%">t</tspan> = βv<tspan baseline-shift="sub" font-size="72%">t-1</tspan> + (1−β)g<tspan baseline-shift="sub" font-size="72%">t</tspan></tspan></text></g></svg>